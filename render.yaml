databases:
  - name: twitter-db
    plan: free
services:
  - type: web
    name: twitter-clone
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi"
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: twitter-db, property: connectionString }
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: SEED
        value: "1"
